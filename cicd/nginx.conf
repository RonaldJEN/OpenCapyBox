
log_format capy '$time_iso8601 remote=$remote_addr client=$http_x_forwarded_for status=$status '
                'rt=$request_time urt=$upstream_response_time '
                '"$request" bytes=$body_bytes_sent ua="$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout capy;

    root /app/frontend/dist;
    index index.html;

    # 对话附件上限 200MB（后端与前端同值），multipart 头部留少量余量
    client_max_body_size 205M;

    # Vite 产物里的 ES module Worker（pdf.js 的 pdf.worker.min.mjs）以 .mjs 结尾。
    # 镜像自带的 mime.types 只映射 js、不映射 mjs，默认按 application/octet-stream 返回，
    # 浏览器会拒绝用这种类型加载 module Worker（PDF 预览失败）。
    location ~* [.]mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（大文件上传 / 长任务）：与 deploy/docker/Dockerfile.frontend 一致，
        # 附件上传请求要等后端把文件同步到沙箱后才返回
        proxy_read_timeout 600;
        proxy_connect_timeout 300;
        proxy_send_timeout 600;

        # SSE 流式（AG-UI 事件流）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }
}
